name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform; Linux is here to catch anything
        # that quietly depends on Windows-only behaviour.
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Deliberately minimal: the suite must pass with no model weights
          # and no audio device, which is what makes it runnable in CI at all.
          pip install numpy pytest tokenizers huggingface-hub
          pip install fastapi uvicorn httpx
          pip install onnxruntime

      - name: Install QNN execution provider (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pip install onnxruntime-qnn

      - name: Report execution provider
        run: python -m sahaay --device

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Pipeline smoke test (mock)
        run: python -m sahaay --cli --mock --no-browser & sleep 12 ; echo done
        shell: bash
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check sahaay/ scripts/ tests/
