name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform; Linux is here to catch anything
        # that quietly depends on Windows-only behaviour.
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Deliberately minimal: the suite must pass with no model weights
          # and no audio device, which is what makes it runnable in CI at all.
          pip install numpy pytest tokenizers huggingface-hub
          pip install fastapi uvicorn httpx
          # websockets is not optional. Without it uvicorn answers /ws with
          # 404 and the UI loads but never updates, and this CI environment
          # was missing it - which tests/test_live_server.py caught on its
          # first run. Keeping it explicit here rather than relying on an
          # extra so the omission cannot recur silently.
          pip install websockets
          pip install onnxruntime

      - name: Install QNN execution provider (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pip install onnxruntime-qnn

      - name: Report execution provider
        run: python -m sahaay --device

      # tests/test_server.py drives the full mock pipeline through the real
      # HTTP and WebSocket surface, so a separate shell smoke step would only
      # duplicate it less reliably.
      - name: Tests
        run: python -m pytest tests/ -q

  # The product ships to ARM64 Windows and had never been run on it. That is
  # the machine a reviewer borrows, and an install that fails there fails on
  # the day rather than in CI.
  #
  # This is NOT a Snapdragon device and proves nothing about the NPU: GitHub's
  # ARM runners are Azure silicon with no Hexagon. What it does prove is the
  # part that was actually untested - that the wheels resolve on win-arm64,
  # that the app imports and reports its provider, and that the suite passes.
  arm64:
    name: tests (windows-11-arm, py3.12)
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest tokenizers huggingface-hub
          pip install fastapi uvicorn httpx websockets
          pip install onnxruntime

      # The whole point of an ARM64 build. Allowed to fail so a wheel that is
      # not published yet does not block the suite - but the step output says
      # plainly whether it installed, which is the thing worth knowing.
      - name: Install QNN execution provider
        continue-on-error: true
        run: pip install onnxruntime-qnn

      - name: Report execution provider
        run: python -m sahaay --device

      - name: Tests
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check sahaay/ scripts/ tests/
